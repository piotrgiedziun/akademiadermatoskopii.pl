name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          # Optional override for the Turnstile site key. The production key is
          # committed in src/consts.ts (it is public — served in the form HTML),
          # so this only needs setting for a fork on another domain.
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}

      # wrangler is a devDependency so this action uses the pinned version.
      # Without it the action silently falls back to wrangler@3.90.0, which
      # ignores the bindings in wrangler.jsonc — deploys "succeed" but ship a
      # site with no D1 binding.
      #
      # No directory argument: wrangler.jsonc supplies pages_build_output_dir,
      # and passing both is rejected when a config file is present.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --project-name=akademia-dermatoskopii --branch=${{ github.head_ref || github.ref_name }}
