name: Deploy mailer Worker

# The mailer is a separate deployable from the Pages site, so without this it
# would silently drift whenever someone edits it and forgets to run wrangler.
# Path-filtered: the site deploy in deploy.yml is unaffected by this workflow.
on:
  push:
    branches: [main]
    paths:
      - 'workers/mailer/**'
      - '.github/workflows/deploy-mailer.yml'
  workflow_dispatch:

concurrency:
  group: mailer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Needs the pinned wrangler from devDependencies: wrangler@3.90.0, which
      # this action installs when none is present, drops the ratelimits
      # bindings without failing the deploy.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config workers/mailer/wrangler.jsonc
